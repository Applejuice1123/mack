name: tag
description: Pick 1-3 tags from a fixed list and write a one-line summary; merged into the note's frontmatter.
glob: "**/*.md"
instruction: |
  Choose up to three tags from the allowed list that describe this note.
  Write a one-sentence summary of what the note is about.
schema:
  type: object
  properties:
    tags: {type: array, items: {type: string, enum: $tags}, maxItems: 3}
    summary: {type: string, maxLength: 200, description: "one sentence"}
apply:
  kind: frontmatter
  fields: [tags, summary]
options:
  tags: [meeting, idea, bug, reference, personal]
