[project]
name = "mack"
version = "0.1.0"
description = "Run a local AI over thousands of your files without your Mac noticing"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mlx>=0.32",
    "mlx-lm>=0.32",
    "fastapi",
    "uvicorn",
    "numpy",
    "psutil",
    "huggingface_hub",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mack = "mack.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mack", "mack.lora"]

[tool.setuptools.package-data]
mack = ["web/*", "native/*", "recipes/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
